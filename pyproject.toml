[project]
name = "lulu-basket"
version = "0.1.0"
description = "Scrape lululemon.com into a snapshot and solve a bounded knapsack over it"
requires-python = ">=3.11"
dependencies = ["curl_cffi>=0.7"]

[project.scripts]
lulu-basket = "lulu_basket.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lulu_basket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
